<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robotron 2027 - Gatekeeper</title>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Bricolage+Grotesque:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root {
            --bg: #f4ead5;
            --red: #bb0013;
            --yellow: #fddc00;
            --dark: #1a1a1a;
            --success: #00c853;
            --error: #e71620;
            --card: #ffffff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Bricolage Grotesque', sans-serif;
            background: var(--bg);
            color: var(--dark);
            padding: 16px;
            min-height: 100vh;
            background-image: radial-gradient(#1a1a1a 0.75px, transparent 0.75px);
            background-size: 16px 16px;
        }

        .container {
            max-width: 480px;
            margin: 0 auto;
        }

        .brand-bar {
            background: var(--red);
            color: white;
            padding: 12px 16px;
            border: 3px solid var(--dark);
            box-shadow: 4px 4px 0px var(--dark);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand-bar h1 {
            font-family: 'Anton', sans-serif;
            font-size: 1.5rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .brand-bar h1 span { color: var(--yellow); }

        .scan-count {
            background: var(--yellow);
            color: var(--dark);
            font-family: 'Anton', sans-serif;
            font-size: 0.85rem;
            padding: 4px 10px;
            border: 2px solid var(--dark);
            letter-spacing: 1px;
        }

        #reader {
            width: 100%;
            border: 3px solid var(--dark) !important;
            border-radius: 0 !important;
            overflow: hidden;
            margin-bottom: 16px;
            box-shadow: 4px 4px 0px var(--dark);
        }
        #reader video { border-radius: 0 !important; }

        .status-box {
            padding: 20px;
            border: 3px solid var(--dark);
            box-shadow: 4px 4px 0px var(--dark);
            margin-top: 16px;
            display: none;
            background: var(--card);
            text-align: center;
        }
        .status-box .status-icon { font-size: 2.5rem; margin-bottom: 8px; }
        .status-box .status-name {
            font-family: 'Anton', sans-serif;
            font-size: 1.3rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin: 4px 0;
        }
        .status-box .status-detail { font-size: 0.9rem; opacity: 0.8; }

        .success { border-color: var(--success); background: #e8f5e9; }
        .success .status-name { color: var(--success); }
        .error { border-color: var(--error); background: #fce4ec; }
        .error .status-name { color: var(--error); }

        .team-panel {
            display: none;
            margin-top: 16px;
            background: var(--card);
            border: 3px solid var(--dark);
            box-shadow: 6px 6px 0px var(--dark);
            padding: 20px;
            text-align: left;
        }
        .team-panel h3 {
            text-align: center;
            font-family: 'Anton', sans-serif;
            font-size: 1.2rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--red);
            margin-bottom: 8px;
        }
        .team-id-display {
            text-align: center;
            font-family: 'Anton', sans-serif;
            font-size: 1.1rem;
            color: var(--red);
            margin-bottom: 4px;
        }
        .team-meta {
            text-align: center;
            font-size: 0.8rem;
            opacity: 0.7;
            margin-bottom: 16px;
            font-weight: 600;
        }

        .member-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 12px;
            margin-bottom: 8px;
            background: var(--bg);
            border: 2px solid var(--dark);
            transition: 0.2s;
        }
        .member-item.checked {
            border-color: var(--success);
            background: #e8f5e9;
        }
        .member-item input[type="checkbox"] {
            width: 20px;
            height: 20px;
            accent-color: var(--success);
            cursor: pointer;
            flex-shrink: 0;
        }
        .member-info { flex: 1; }
        .member-name { font-weight: 700; font-size: 0.95rem; }
        .member-email { font-size: 0.75rem; opacity: 0.6; }
        .member-status {
            font-size: 0.7rem;
            font-family: 'Anton', sans-serif;
            letter-spacing: 1px;
            padding: 3px 8px;
            border: 2px solid var(--dark);
            flex-shrink: 0;
            text-transform: uppercase;
        }
        .member-status.present { background: var(--success); color: white; border-color: var(--success); }
        .member-status.absent { background: var(--error); color: white; border-color: var(--error); }

        .confirm-btn {
            width: 100%;
            margin-top: 16px;
            padding: 14px;
            font-family: 'Anton', sans-serif;
            font-size: 1.2rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: var(--success);
            color: white;
            border: 3px solid var(--dark);
            box-shadow: 4px 4px 0px var(--dark);
            cursor: pointer;
            transition: all 0.15s;
            display: none;
        }
        .confirm-btn:hover { transform: translate(2px, 2px); box-shadow: 2px 2px 0px var(--dark); }
        .confirm-btn:active { transform: translate(4px, 4px); box-shadow: none; }
        .confirm-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: 4px 4px 0px var(--dark); }

        .summary {
            text-align: center;
            margin-top: 8px;
            font-size: 0.85rem;
            font-weight: 700;
            opacity: 0.7;
        }

        .scan-again-btn {
            display: none;
            margin-top: 16px;
            padding: 14px 32px;
            font-family: 'Anton', sans-serif;
            font-size: 1.1rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: var(--yellow);
            color: var(--dark);
            border: 3px solid var(--dark);
            box-shadow: 4px 4px 0px var(--dark);
            cursor: pointer;
            transition: all 0.15s;
            width: 100%;
        }
        .scan-again-btn:hover { transform: translate(2px, 2px); box-shadow: 2px 2px 0px var(--dark); }

        .manual-section {
            margin-top: 24px;
            border-top: 3px dashed var(--dark);
            padding-top: 16px;
            text-align: center;
        }
        .manual-section p {
            font-weight: 700;
            font-size: 0.85rem;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .manual-input-row {
            display: flex;
            gap: 8px;
        }
        .manual-input-row input[type="text"] {
            flex: 1;
            background: var(--card);
            border: 3px solid var(--dark);
            color: var(--dark);
            padding: 12px;
            font-family: 'Bricolage Grotesque', sans-serif;
            font-weight: 700;
            font-size: 0.95rem;
            outline: none;
        }
        .manual-input-row input[type="text"]:focus {
            border-color: var(--red);
        }
        .manual-input-row button {
            padding: 12px 20px;
            font-family: 'Anton', sans-serif;
            font-size: 1rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            background: var(--red);
            color: white;
            border: 3px solid var(--dark);
            box-shadow: 3px 3px 0px var(--dark);
            cursor: pointer;
            transition: all 0.15s;
        }
        .manual-input-row button:hover { transform: translate(1px, 1px); box-shadow: 2px 2px 0px var(--dark); }

        .footer-badge {
            margin-top: 24px;
            background: var(--dark);
            color: white;
            padding: 12px;
            border: 3px solid var(--dark);
            text-align: center;
            font-family: 'Anton', sans-serif;
            font-size: 0.8rem;
            letter-spacing: 2px;
        }
        .footer-badge span { color: var(--yellow); }

        /* ---- admin gate ---- */
        #authGate {
            background: var(--card);
            border: 3px solid var(--dark);
            box-shadow: 4px 4px 0px var(--dark);
            padding: 24px;
            margin-bottom: 20px;
        }
        #authGate h2 {
            font-family: 'Anton', sans-serif;
            background: var(--dark);
            color: white;
            padding: 10px 12px;
            margin-bottom: 16px;
            letter-spacing: 1px;
            text-align: center;
        }
        #authGate label {
            display: block;
            font-family: 'Anton', sans-serif;
            font-size: 0.8rem;
            letter-spacing: 1px;
            margin: 12px 0 4px;
        }
        #authGate input {
            width: 100%;
            padding: 12px;
            border: 3px solid var(--dark);
            background: var(--bg);
            font-family: 'Bricolage Grotesque', sans-serif;
            font-size: 1rem;
        }
        #authGate button {
            width: 100%;
            margin-top: 16px;
            padding: 14px;
            background: var(--red);
            color: white;
            border: 3px solid var(--dark);
            box-shadow: 4px 4px 0px var(--dark);
            font-family: 'Anton', sans-serif;
            font-size: 1.1rem;
            letter-spacing: 2px;
            cursor: pointer;
        }
        #authGate button:disabled { opacity: 0.5; cursor: not-allowed; }
        #authError {
            margin-top: 12px;
            color: var(--red);
            font-weight: 700;
            font-size: 0.9rem;
            display: none;
        }
        #gateContent { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <!-- Admin sign-in gate. firestore.rules restricts registrations to
             the `admin: true` custom claim, so this page must authenticate. -->
        <div id="authGate">
            <h2>ADMIN ACCESS</h2>
            <label for="adminEmail">EMAIL</label>
            <input type="email" id="adminEmail" placeholder="admin@robotron2027.com" autocomplete="username">
            <label for="adminPassword">PASSWORD</label>
            <input type="password" id="adminPassword" placeholder="Password" autocomplete="current-password">
            <button id="authBtn">UNLOCK SCANNER</button>
            <p id="authError"></p>
        </div>

        <div id="gateContent">
        <div class="brand-bar">
            <h1>ROBOTRON <span>2027</span></h1>
            <div class="scan-count" id="scanCount">SCANNED: 0</div>
        </div>

        <div id="reader"></div>
        <div id="statusBox" class="status-box"></div>

        <!-- Team Checklist Panel -->
        <div class="team-panel" id="teamPanel">
            <h3>TEAM CHECK-IN</h3>
            <div class="team-id-display" id="teamIdDisplay"></div>
            <div class="team-meta" id="teamMeta"></div>
            <div id="memberList"></div>
            <div class="summary" id="checkSummary"></div>
            <button class="confirm-btn" id="confirmBtn">CONFIRM CHECK-IN</button>
        </div>

        <button class="scan-again-btn" id="scanAgainBtn">SCAN ANOTHER PASS</button>

        <div class="manual-section">
            <p>Can't scan? Enter Team ID manually:</p>
            <div class="manual-input-row">
                <input type="text" id="manualId" placeholder="e.g. AUTO123456">
                <button id="manualBtn">CHECK</button>
            </div>
        </div>

        <div class="footer-badge">
            <span>ROBOTRON 2027</span> &mdash; PARK COLLEGE OF ENGINEERING
        </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
        import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";
        import {
            getAuth,
            signInWithEmailAndPassword,
            onAuthStateChanged,
            signOut
        } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCQKLM92UMnSb_ZLd7BZGgH6TNP9ugXffg",
            authDomain: "atlantix2k26.firebaseapp.com",
            projectId: "atlantix2k26",
            storageBucket: "atlantix2k26.firebasestorage.app",
            messagingSenderId: "988770007742",
            appId: "1:988770007742:web:742114c6f386a0422fbcef"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        // ---- admin gate -------------------------------------------------
        const authGate = document.getElementById('authGate');
        const gateContent = document.getElementById('gateContent');
        const authBtn = document.getElementById('authBtn');
        const authError = document.getElementById('authError');
        const emailInput = document.getElementById('adminEmail');
        const passwordInput = document.getElementById('adminPassword');

        function showAuthError(msg) {
            authError.textContent = msg;
            authError.style.display = 'block';
        }

        function clearAuthError() {
            authError.textContent = '';
            authError.style.display = 'none';
        }

        function onUnlocked() {
            authGate.style.display = 'none';
            gateContent.style.display = 'block';
            if (typeof startScanner === 'function') startScanner();
        }

        function onLocked(message) {
            authGate.style.display = 'block';
            gateContent.style.display = 'none';
            if (message) showAuthError(message);
        }

        // Firebase Auth UIDs allowed to use the scanner.
        // Mirrors the ADMIN_UIDS list in firestore.rules - keep both in sync.
        const ADMIN_UIDS = [
            'jX9wljERWsgpJtRB1NyeFl1fnWv1',
        ];

        function isAdmin(user) {
            return !!user && ADMIN_UIDS.includes(user.uid);
        }

        authBtn.addEventListener('click', async () => {
            clearAuthError();
            const email = emailInput.value.trim();
            const password = passwordInput.value;
            if (!email || !password) {
                showAuthError('Enter your admin email and password.');
                return;
            }
            authBtn.disabled = true;
            authBtn.textContent = 'VERIFYING...';
            try {
                const cred = await signInWithEmailAndPassword(auth, email, password);
                if (isAdmin(cred.user)) {
                    passwordInput.value = '';
                    onUnlocked();
                } else {
                    await signOut(auth);
                    showAuthError('This account does not have admin access.');
                }
            } catch (err) {
                const code = err && err.code ? err.code : '';
                if (code === 'auth/invalid-credential' || code === 'auth/wrong-password'
                    || code === 'auth/user-not-found') {
                    showAuthError('Invalid email or password.');
                } else {
                    showAuthError((err && err.message) || 'Sign-in failed.');
                }
            } finally {
                authBtn.disabled = false;
                authBtn.textContent = 'UNLOCK SCANNER';
            }
        });

        // Enforce the gate on every page load, not just via the button.
        onAuthStateChanged(auth, (user) => {
            if (isAdmin(user)) {
                onUnlocked();
            } else {
                if (user) signOut(auth);
                onLocked();
            }
        });

        let scanCountNum = 0;
        let html5Qr = null;
        let lastScannedId = null;
        let currentTeamData = null;
        let currentTeamId = null;
        let isScanning = false;

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        document.addEventListener('click', () => { if (audioCtx.state === 'suspended') audioCtx.resume(); }, { once: true });
        document.addEventListener('touchstart', () => { if (audioCtx.state === 'suspended') audioCtx.resume(); }, { once: true });

        function playBeep(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const now = audioCtx.currentTime;
            if (type === 'success') {
                const osc1 = audioCtx.createOscillator();
                const g1 = audioCtx.createGain();
                osc1.connect(g1); g1.connect(audioCtx.destination);
                osc1.frequency.value = 880; g1.gain.value = 0.4;
                osc1.start(now); osc1.stop(now + 0.12);
                const osc2 = audioCtx.createOscillator();
                const g2 = audioCtx.createGain();
                osc2.connect(g2); g2.connect(audioCtx.destination);
                osc2.frequency.value = 1100; g2.gain.value = 0.4;
                osc2.start(now + 0.13); osc2.stop(now + 0.28);
            } else if (type === 'warning') {
                const osc = audioCtx.createOscillator();
                const g = audioCtx.createGain();
                osc.connect(g); g.connect(audioCtx.destination);
                osc.frequency.value = 600; g.gain.value = 0.4;
                osc.start(now); osc.stop(now + 0.2);
            } else if (type === 'error') {
                const osc = audioCtx.createOscillator();
                const g = audioCtx.createGain();
                osc.connect(g); g.connect(audioCtx.destination);
                osc.frequency.value = 300; g.gain.value = 0.4;
                osc.start(now); osc.stop(now + 0.35);
            }
        }

        async function stopScanner() {
            if (html5Qr && isScanning) {
                try { await html5Qr.stop(); } catch (e) {}
                isScanning = false;
            }
        }

        async function startScanner() {
            document.getElementById('reader').style.display = 'block';
            document.getElementById('teamPanel').style.display = 'none';
            document.getElementById('statusBox').style.display = 'none';
            document.getElementById('scanAgainBtn').style.display = 'none';

            html5Qr = new Html5Qrcode("reader");
            isScanning = true;

            try {
                await html5Qr.start(
                    { facingMode: "environment" },
                    { fps: 10, qrbox: 250 },
                    onScanSuccess,
                    () => {}
                );
            } catch (err) {
                console.error("Camera start failed:", err);
                document.getElementById('statusBox').style.display = 'block';
                document.getElementById('statusBox').className = 'status-box error';
                document.getElementById('statusBox').innerHTML = `
                    <div class="status-icon">CAMERA ERROR</div>
                    <div class="status-name">COULD NOT ACCESS CAMERA</div>
                    <div class="status-detail">Use manual entry below</div>
                `;
            }
        }

        async function onScanSuccess(decodedText) {
            if (decodedText === lastScannedId) return;
            lastScannedId = decodedText;
            await stopScanner();
            await verifyEntry(decodedText);
        }

        async function verifyEntry(scannedId) {
            // Defence in depth: firestore.rules already denies non-admins.
            if (gateContent.style.display === 'none') {
                onLocked('Sign in with an admin account to continue.');
                return;
            }
            const statusBox = document.getElementById('statusBox');
            statusBox.style.display = "block";
            statusBox.innerHTML = '<div class="status-name">PROCESSING...</div>';
            statusBox.className = "status-box";

            try {
                const cleanId = scannedId.trim().toUpperCase();
                const docRef = doc(db, "registrations", cleanId);
                const docSnap = await getDoc(docRef);

                if (!docSnap.exists()) {
                    playBeep('error');
                    statusBox.classList.add('error');
                    statusBox.innerHTML = `
                        <div class="status-icon">X</div>
                        <div class="status-name">INVALID TEAM ID</div>
                        <div class="status-detail">Not found in database</div>
                        <div class="status-detail" style="margin-top:6px;font-family:'Anton';letter-spacing:1px;">ID: ${cleanId}</div>
                    `;
                    document.getElementById('scanAgainBtn').style.display = 'block';
                    return;
                }

                const data = docSnap.data();
                renderTeamPanel(cleanId, data);

            } catch (err) {
                console.error("Verify error:", err);
                playBeep('error');
                statusBox.classList.add('error');
                statusBox.innerHTML = `
                    <div class="status-icon">!</div>
                    <div class="status-name">CONNECTION ERROR</div>
                    <div class="status-detail">Could not connect to database</div>
                `;
                document.getElementById('scanAgainBtn').style.display = 'block';
            }
        }

        function renderTeamPanel(teamId, data) {
            currentTeamData = data;
            currentTeamId = teamId;

            document.getElementById('teamIdDisplay').textContent = teamId;
            document.getElementById('teamMeta').textContent = `Team Lead: ${data.teamLead} | Event: ${data.technicalEvent || 'N/A'}`;

            const memberList = document.getElementById('memberList');
            memberList.innerHTML = '';

            data.members.forEach((member, index) => {
                const isAlreadyChecked = member.checkedIn;
                const item = document.createElement('div');
                item.className = 'member-item' + (isAlreadyChecked ? ' checked' : '');
                item.innerHTML = `
                    <input type="checkbox" data-index="${index}" ${isAlreadyChecked ? 'checked' : ''}>
                    <div class="member-info">
                        <div class="member-name">${member.name || 'Unknown'}</div>
                        <div class="member-email">${member.email || ''}</div>
                    </div>
                    <span class="member-status ${isAlreadyChecked ? 'present' : 'absent'}">${isAlreadyChecked ? 'PRESENT' : 'ABSENT'}</span>
                `;
                memberList.appendChild(item);
            });

            memberList.querySelectorAll('input[type="checkbox"]').forEach(cb => {
                cb.addEventListener('change', updateSummary);
            });

            updateSummary();
            document.getElementById('reader').style.display = 'none';
            document.getElementById('statusBox').style.display = 'none';
            document.getElementById('teamPanel').style.display = 'block';
            document.getElementById('confirmBtn').style.display = 'block';
            document.getElementById('teamPanel').scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function updateSummary() {
            const checkboxes = document.querySelectorAll('#memberList input[type="checkbox"]');
            const checked = [...checkboxes].filter(cb => cb.checked).length;
            const total = checkboxes.length;
            document.getElementById('checkSummary').textContent = `${checked} of ${total} members present`;
        }

        document.getElementById('confirmBtn').addEventListener('click', async () => {
            if (!currentTeamData || !currentTeamId) return;

            const confirmBtn = document.getElementById('confirmBtn');
            confirmBtn.disabled = true;
            confirmBtn.textContent = 'SAVING...';

            const checkboxes = document.querySelectorAll('#memberList input[type="checkbox"]');
            const updatedMembers = currentTeamData.members.map((m, i) => ({
                ...m,
                checkedIn: checkboxes[i].checked
            }));
            const allCheckedIn = updatedMembers.every(m => m.checkedIn);

            try {
                const docRef = doc(db, "registrations", currentTeamId);
                await updateDoc(docRef, {
                    members: updatedMembers,
                    checkedIn: allCheckedIn
                });

                const checkedCount = updatedMembers.filter(m => m.checkedIn).length;
                playBeep('success');
                scanCountNum++;
                document.getElementById('scanCount').textContent = `SCANNED: ${scanCountNum}`;

                const statusBox = document.getElementById('statusBox');
                statusBox.style.display = 'block';
                statusBox.className = 'status-box success';
                statusBox.innerHTML = `
                    <div class="status-icon">CHECK-IN UPDATED</div>
                    <div class="status-name" style="color:var(--success)">${currentTeamData.teamLead}</div>
                    <div class="status-detail">Team: ${currentTeamId}</div>
                    <div class="status-detail" style="margin-top:10px;font-weight:700;">${checkedCount} of ${updatedMembers.length} members checked in</div>
                    ${allCheckedIn ? '<div class="status-detail" style="color:var(--success);margin-top:5px;font-weight:700;">All members present!</div>' : ''}
                `;

                document.getElementById('teamPanel').style.display = 'none';
                document.getElementById('confirmBtn').style.display = 'none';
                document.getElementById('scanAgainBtn').style.display = 'block';
            } catch (err) {
                console.error("Save error:", err);
                playBeep('error');
                confirmBtn.disabled = false;
                confirmBtn.textContent = 'CONFIRM CHECK-IN';
                const statusBox = document.getElementById('statusBox');
                statusBox.style.display = 'block';
                statusBox.className = 'status-box error';
                statusBox.innerHTML = `
                    <div class="status-icon">!</div>
                    <div class="status-name">SAVE FAILED</div>
                    <div class="status-detail">Could not update database</div>
                `;
            }
        });

        document.getElementById('scanAgainBtn').addEventListener('click', () => {
            lastScannedId = null;
            currentTeamData = null;
            currentTeamId = null;
            document.getElementById('statusBox').style.display = 'none';
            document.getElementById('scanAgainBtn').style.display = 'none';
            document.getElementById('teamPanel').style.display = 'none';
            document.getElementById('confirmBtn').style.display = 'none';
            document.getElementById('confirmBtn').disabled = false;
            document.getElementById('confirmBtn').textContent = 'CONFIRM CHECK-IN';
            document.getElementById('manualId').value = '';
            startScanner();
        });

        document.getElementById('manualBtn').addEventListener('click', () => {
            const id = document.getElementById('manualId').value;
            if (id) {
                lastScannedId = null;
                stopScanner().then(() => verifyEntry(id));
            }
        });

        // NOTE: startScanner() is intentionally not called here. It is started
        // by onUnlocked() once the admin claim is verified.
    </script>
</body>
</html>
